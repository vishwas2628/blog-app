{% extends 'base.html' %}

{% block title %} Add New Post {% endblock %}
{% block content %}
{% load crispy_forms_tags %}
<div class="row">
    <!---- left side bar ---->
    {% include 'dashboard/sidebar.html' %}

    <!---- right side content ---->
    <div class="col-md-9">
        <h2>Add New Post</h2>

        <form action="{% url 'add_post' %}" method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form | crispy }}
            <button type="button" class="btn btn-danger" id="sendBodyBtn">Phrase Body</button>
            <button type="submit" class="btn btn-warning">Submit</button>
        </form>

    </div>
</div>

<script>
  document.getElementById("sendBodyBtn").addEventListener("click", async function () {
    const bodyText = document.getElementById("id_blog_body").value;

    const response = await fetch("http://localhost:8000/dashboard/api/send-body/", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "X-CSRFToken": document.querySelector("[name=csrfmiddlewaretoken]").value
      },
      body: JSON.stringify({
        blog_body: bodyText
      })
    });

    const data = await response.json();

    document.getElementById("id_blog_body").value = data.text;
    console.log(data);
  });
</script>
{% endblock %}
