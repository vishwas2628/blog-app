{% extends 'base.html' %}

{% block title %} Add New Post {% endblock %}

{% block extra_head %}
{{ form.media }}
{% endblock %}

{% block content %}
{% load crispy_forms_tags %}
<div class="row">
    <!---- left side bar ---->
    {% include 'dashboard/sidebar.html' %}

    <!---- right side content ---->
    <div class="col-md-9">
        <h2>Add New Post</h2>

        <form action="{% url 'add_post' %}" method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form | crispy }}
            <button type="button" class="btn btn-danger" id="sendBodyBtn">Phrase Body</button>
            <button type="submit" class="btn btn-warning">Submit</button>
        </form>

    </div>
</div>

<script>
  document.getElementById("sendBodyBtn").addEventListener("click", async function () {
    // Extract text directly from TinyMCE editor if it's active
    let bodyText = "";
    if (typeof tinymce !== 'undefined' && tinymce.get('id_blog_body')) {
        bodyText = tinymce.get('id_blog_body').getContent();
    } else {
        bodyText = document.getElementById("id_blog_body").value;
    }
    console.log(bodyText);

    const response = await fetch("http://localhost:8000/dashboard/api/send-body/", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "X-CSRFToken": document.querySelector("[name=csrfmiddlewaretoken]").value
      },
      body: JSON.stringify({
        blog_body: bodyText
      })
    });

    const data = await response.json();

    // Set text back into the TinyMCE editor
    if (typeof tinymce !== 'undefined' && tinymce.get('id_blog_body')) {
        tinymce.get('id_blog_body').setContent(data.text);
    } else {
        document.getElementById("id_blog_body").value = data.text;
    }
    console.log(data);
  });
</script>
{% endblock %}
